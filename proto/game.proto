syntax = "proto3";

package game;

// ============================================================================
// 统一实体信息
// ----------------------------------------------------------------------------
// 所有可交互物体都是 Entity:玩家、木桩、箱子、陷阱...
// 区别在 entity_type 决定的"行为能力"(见服务端 entity_config.py):
//   - player: 可移动/可攻击/可被攻击/可断连
//   - stake:  不可移动/不可攻击/可被攻击/不可断连
// player_name / moving 等 player 特有字段其他类型不填(空值/默认值)
// ============================================================================
message EntityInfo {
  string entity_id = 1;      // 实体ID,格式 "player:uuid" | "entity:stake_1"
  string entity_type = 2;    // 类型:player/stake/...(决定行为能力+碰撞形状,见 entity_config)
  float x = 3;               // X坐标
  float y = 4;               // Y坐标
  float facing = 5;          // 朝向角度(弧度),0=右,逆时针正(Godot 标准)。木桩永远 0
  string state = 6;          // 动画状态:idle/run/attack/hurt/...(服务端权威,客户端只读镜像)
  // 注:radius 字段已删除——碰撞形状改由 entity_type 查 entity_config 决定
  // player 特有字段(其他类型不填)
  string player_name = 8;    // 玩家名称
  bool moving = 9;           // 是否正在移动(客户端发,服务端据此设 state=idle/run)
  string account_id = 10;    // 账号ID(客户端本地存档生成,跨会话稳定;服务端优先用它作 player_id)
  string ai_state = 11;      // AI 状态:patrol/chase/attack/look_around(只有敌人填,玩家/木桩留空)
}

// 聊天消息
message ChatMessage {
  string player_id = 1;      // 发送者ID
  string player_name = 2;    // 发送者名称
  string content = 3;        // 消息内容
  int64 timestamp = 4;       // 时间戳
}

// 玩家移动消息(C2S:发输入方向;S2C:广播服务端算出的位置)
// ----------------------------------------------------------------------------
// 两种语义区分(同一个消息,C2S 和 S2C 字段含义不同):
//   - C2S(客户端→服务端):发方向向量(dir_x/dir_y)+ moving
//     客户端不再发目标坐标,避免"客户端 60Hz 算位置,服务端 30Hz 节流丢半"的拉回问题
//     服务端按 dir * speed * TICK_INTERVAL 推进位移,保证速度一致
//   - S2C(服务端→客户端):广播落地后的绝对坐标(x/y)+ moving
//     客户端收到后更新 target_pos,在 _process 里 lerp 插值(30Hz→60Hz 平滑)
//
// 字段使用规则:
//   - C2S 时:填 dir_x/dir_y/moving,x/y/speed 不填(服务端忽略)
//   - S2C 时:填 x/y/moving,dir_x/dir_y 不填(客户端忽略)
//   - moving 两端都用:驱动动画状态 idle/run
// ----------------------------------------------------------------------------
message PlayerMove {
  string entity_id = 1;      // 实体ID
  float x = 2;               // [S2C] 服务端算出的 X坐标
  float y = 3;               // [S2C] 服务端算出的 Y坐标
  float speed = 4;           // [已废弃,保留字段] 旧协议残留,服务端不再读;speed 改由 entity_config.json 配置
  bool moving = 5;           // 是否正在移动(两端都用,驱动动画 state=idle/run)
  float dir_x = 6;           // [C2S] 移动方向向量 x(-1~1,归一化)
  float dir_y = 7;           // [C2S] 移动方向向量 y(-1~1,归一化)
}

// 玩家朝向消息(增量更新,只改 facing 不改坐标)
// 和 PlayerMove 平行,但只改 facing 不改坐标
// 设计原因:朝向和移动是两个独立状态维度——玩家可以移动时朝任意方向攻击
message PlayerFacing {
  string entity_id = 1;      // 实体ID
  float facing = 2;          // 朝向角度(弧度)
}

// 登录/建立服务器会话（进入大厅）
message Login {
  string account_id = 1;     // 客户端本地账号ID（跨会话稳定，服务端优先用它作为 player_id）
  string player_name = 2;    // 玩家名称
}


// 进入游戏房间
message EnterRoom {
  EntityInfo entity_info = 1; // 加入的实体信息
}

// 离开游戏房间（保持服务器会话，仍可在大厅聊天）
message LeaveRoom {
  string entity_id = 1;      // 离开的实体ID
}

// 攻击开始
message AttackStart {
  string entity_id = 1;      // 攻击者ID
  int32 atk_id = 2;          // 攻击ID(对应 ATTACK_CONFIG 的 key)
}

// 攻击命中
message AttackHit {
  string attacker_id = 1;    // 攻击者ID
  repeated string hit_list = 2; // 命中目标ID列表
  int32 atk_id = 3;          // 攻击ID
  int32 hurt_duration = 4;   // 受击硬直时长(毫秒),客户端当前不读,留作未来预演/调试用
  int32 atk_shape_idx = 5;  // atk_id对应攻击的第几个形状
}

// 受击结束
message HurtEnd {
  string attacker_id = 1;
  string hurt_id = 2;
  int32 atk_id = 3;
  int32 hurt_duration = 4;
}

// 攻击结束
message AttackEnd {
  string entity_id = 1;      // 攻击者ID
}

// 游戏状态更新(完整快照,新玩家加入/定期同步用)
message GameState {
  repeated EntityInfo entities = 1; // 所有实体信息(玩家+木桩+...)
  int64 timestamp = 2;              // 时间戳
}

// 心跳消息
message Heartbeat {
  int64 timestamp = 1;       // 时间戳
}

// 单个实体的战斗属性快照(用于 StatsInit 批量初始化)
message CombatStatsEntry {
    string entity_id = 1;
    int32 max_hp = 2;
    int32 cur_hp = 3;
    int32 attack_power = 4;
    int32 defense = 5;
}

// 战斗属性批量同步(新玩家加入时发)
message StatsInit {
    repeated CombatStatsEntry entries = 1;
}

// 战斗属性变更(强化时广播)
message StatsChanged {
    string entity_id = 1;
    int32 max_hp = 2;
    int32 attack_power = 3;
    int32 defense = 4;
    // 不含 cur_hp,cur_hp 走 HpChanged
}

// 血量变更(每次 hurt 时广播,含飘字数据)
message HpChanged {
    string entity_id = 1;       // 被打的人
    int32 cur_hp = 2;           // 剩余血量
    int32 damage = 3;           // 本次伤害(飘字数字)
    string attacker_id = 4;     // 谁打的(飘字定位用,客户端取 attacker 位置)
    int32 atk_id = 5;           // 哪个攻击(取形状算命中点)
    int32 atk_shape_idx = 6;    // 第几段 shape(算命中点)
}

// 实体死亡(S2C 广播)
// 服务端 apply_hurt 判定 hp<=0 且 can_die=True 时广播。
// 客户端收到后切 DeadState 播死亡动画,但不立即移除节点——
// 等 EntityRemove 消息来才 queue_free(让死亡动画播完)。
// 服务端"立即判定死亡"但"延迟移除实体",由 DeadTimer 控制延迟时长。
message EntityDead {
    string entity_id = 1;       // 死亡的实体ID
    string attacker_id = 2;     // 击杀者ID(未来击杀日志/功劳簿用)
    int32 atk_id = 3;           // 致死的攻击ID
}

// 实体移除(S2C 广播)
// DeadTimer 到期后服务端调 remove_entity + 广播本消息。
// 客户端收到后 queue_free 对应 Role 节点。
// 和 LeaveRoom 的区别:LeaveRoom 是断连(实体消失),EntityRemove 是死亡(播完动画后移除)。
message EntityRemove {
    string entity_id = 1;       // 被移除的实体ID
}

// 网络延迟探测(C2S: 客户端发 Ping; S2C: 服务端原样回 Pong)
message Ping {
  int64 t = 1;    // 客户端发送时刻(ms, Time.get_ticks_msec())
}
message Pong {
  int64 t = 1;    // 服务端原样回填客户端的时间戳,客户端用 now - t 算 RTT
}

// 地图信息(S2C: 新玩家加入时单播给该玩家)
// ----------------------------------------------------------------------------
// 项目采用「服务器持有种子,双端一致生成」的架构(见 docs/client-ui.md):
//   - 服务端启动时持有 seed(当前硬编码 12345,未来可改成随机生成)
//   - 客户端 InfiniteTileMap.setup(seed) 用 seed 构造 ChunkGenerator
//   - 双端用同一份 seed + 同一份算法产出完全相同的地图(详见 map_generator.py)
//
// 发送时机:EnterRoom handler 里,在 GameState 之前单播给新玩家。
// 为什么在 GameState 之前:让客户端先初始化地图,再创建实体。
//   实体坐标是世界坐标,地图没初始化时实体显示位置不对(虽然不影响逻辑)。
//
// 为什么只单播不广播:每个玩家只需要在加入时收到一次 MapInfo。
//   已在线玩家早就收到过了,重发浪费带宽。
// ----------------------------------------------------------------------------
message MapInfo {
  int32 seed = 1;            // 地图种子(服务端启动时生成,当前硬编码 12345)
}

// AI 状态变更(S2C 增量,只改 ai_state 不改坐标/朝向)
// 和 PlayerFacing 平行:AI 状态是独立维度(区别于 EntityInfo.state 动画状态),
// 状态切换时实时广播——客户端据此切换敌人视锥形态(normal/chase),不能等低频快照。
// 由服务端 EnemyAIMachine.change_state 状态真正切换(old != new)时触发广播。
message AiStateChanged {
  string entity_id = 1;      // 实体ID
  string ai_state = 2;       // 新的 AI 状态:patrol/chase/attack/look_around(只有敌人有)
}

// 通用消息包装器
message GameMessage {
  oneof message_type {
    Login login = 21;
      EnterRoom enter_room = 1;       // 进入游戏房间
    LeaveRoom leave_room = 2;     // 离开游戏房间
    PlayerMove player_move = 3;       // 玩家移动
    ChatMessage chat_message = 4;     // 聊天消息
    GameState game_state = 5;         // 游戏状态
    Heartbeat heartbeat = 6;          // 心跳
    PlayerFacing player_facing = 7;   // 玩家朝向
    AttackStart attack_start = 8;     // 攻击开始(双端:C2S 发起 / S2C 广播)
    AttackHit attack_hit = 9;         // 攻击命中(S2C 广播)
    AttackEnd attack_end = 10;        // 攻击结束(S2C 广播)
    HurtEnd hurt_end = 11;            // 受击结束(S2C 广播)
    StatsInit stats_init = 12;
    StatsChanged stats_changed = 13;
    HpChanged hp_changed = 14;
    EntityDead entity_dead = 15;      // 实体死亡(S2C 广播)
    EntityRemove entity_remove = 16;  // 实体移除(S2C 广播)
    Ping ping = 17;       // 延迟探测请求(C2S)
    Pong pong = 18;       // 延迟探测响应(S2C)
    MapInfo map_info = 19;            // 地图信息(S2C 单播,新玩家加入时发)
    AiStateChanged ai_state_changed = 20; // AI 状态变更(S2C 广播,敌人状态切换时发)
  }
}
